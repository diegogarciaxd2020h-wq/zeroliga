<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZeroLiga</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="logo">
        💜
    </div>

    <h1>ZeroLiga</h1>

    <p>
        Tu asistente para crear mejores conversaciones
    </p>


    <h2>¿Qué necesitas?</h2>


    <div class="options">

        <button>
            💘 Primera conversación
        </button>

        <button>
            💬 Responder mensajes
        </button>

        <button>
            🔥 Coqueteo
        </button>

        <button>
            😂 Ser divertido
        </button>

        <button>
            ❤️ Mensaje romántico
        </button>

        <button>
            💔 Pedir disculpas
        </button>

    </div>


    <div class="box">

        <textarea placeholder="Describe la situación..."></textarea>


        <button class="generate">
            Generar respuesta 💜
        </button>

    </div>


    <div class="response">

        <h3>Respuesta:</h3>

        <p>
        Aquí aparecerá tu frase generada...
        </p>

    </div>


    <footer>
        ⏳ ZeroLiga Beta - Disponible por tiempo limitado
    </footer>


</div>


<script src="script.js"></script>

</body>
</html>
